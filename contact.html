                <div class="content">
                    <p>Selecciona un canal de comunicación:</p>
                 
                    <p><span aria-hidden="true">&gt; </span>./send_message.sh</p>
                    <form id="retro-contact-form" class="retro-form">
                        <div class="form-group">
                            <label for="senderName">NAME:</label>
                            <input type="text" id="senderName" name="name" required placeholder="_">
                        </div>
                        <div class="form-group">
                            <label for="senderEmail">MAIL:</label>
                            <input type="email" id="senderEmail" name="email" required placeholder="_">
                        </div>
                        <div class="form-group">
                            <label for="senderMessage">MESSAGE:</label>
                            <textarea id="senderMessage" name="message" rows="4" required placeholder="_"></textarea>
                        </div>
                        <button type="submit" class="btn-retro form-submit">[ SEND PACKAGE ]</button>
                        <p id="form-status" class="alert hidden" aria-live="polite"></p>
                    </form>
                </div>
              </article>
